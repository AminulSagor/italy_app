name: italir_pothe
description: "Italir Pothe — an interactive platform for learning Italian."
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  audio_waveforms: ^1.3.0
  video_player: ^2.11.1
  just_audio: ^0.10.5
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2928.1
  syncfusion_flutter_pdfviewer: ^33.2.6
  syncfusion_flutter_pdf: ^33.2.6
  flex_color_picker: ^3.8.0
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.1
  pretty_dio_logger: ^1.4.0
  agora_rtc_engine: ^6.5.2
  socket_io_client: ^3.1.2
  permission_handler: ^12.0.1
  livekit_client: ^2.7.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  uuid: ^4.5.3
  flutter_local_notifications: ^22.0.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.3
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  flutter_callkit_incoming:
    path: plugins/flutter_callkit_incoming
  pdf:
  printing:
  media_store_plus: ^0.1.3
  screen_protector: ^1.5.2
  internet_connection_checker_plus: ^3.1.1
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2
  audioplayers: ^6.8.1
  proximity_screen_lock: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  reorderable_grid_view: ^2.2.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons_png/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: true
  web: false

  # Android 11 and lower, and iOS.
  color: "#FFFFFF"
  image: "assets/decor_png/splash_logo.png"
  fullscreen: false

  # Android 12 and newer.
  android_12:
    color: "#FFFFFF"
    image: "assets/decor_png/splash_logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/decor_png/
    - assets/icons_png/
    - assets/icons_svg/
    - assets/profile_images/
    - assets/heroes/
    - assets/guides/
    - assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
