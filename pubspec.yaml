name: italir_pothe
description: "Italir Pothe — an interactive platform for learning Italian."
publish_to: "none"

version: 1.0.0+20

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  audio_waveforms: ^1.3.0
  video_player: ^2.11.1
  just_audio: ^0.10.5
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2928.1
  syncfusion_flutter_pdfviewer: ^33.2.6
  syncfusion_flutter_pdf: ^33.2.6
  flex_color_picker: ^3.8.0
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^6.0.1
  pretty_dio_logger: ^1.4.0
  agora_rtc_engine: ^6.5.2
  socket_io_client: ^3.1.2
  permission_handler: ^12.0.1
  audio_session: ^0.2.3
  web_socket_channel: ^3.0.3
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.3.0
  uuid: ^4.5.3
  flutter_local_notifications: ^22.0.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.0
  wakelock_plus: ^1.3.3
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  in_app_purchase_storekit: ^0.4.10
  intl: ^0.20.2
  flutter_callkit_incoming:
    path: plugins/flutter_callkit_incoming
  pdf:
  printing:
  media_store_plus: ^0.1.3
  screen_protector: ^1.5.2
  internet_connection_checker_plus: ^3.1.1
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2
  audioplayers: ^6.8.1
  proximity_screen_lock: ^2.3.0
  pdfrx: ^2.4.7
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  reorderable_grid_view: ^2.2.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons_png/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: true
  web: false

  # Android 11 and lower, and iOS.
  color: "#FFFFFF"
  image: "assets/decor_png/splash_logo.png"
  fullscreen: false

  # Android 12 and newer.
  android_12:
    color: "#FFFFFF"
    image: "assets/decor_png/splash_logo.png"

flutter:
  # Agora's iOS Swift package currently references AgoraPIPController.h from
  # a binary that does not ship that header. Use its supported CocoaPods
  # integration until the upstream Swift package is corrected.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansBengali-ExtraBold.ttf
          weight: 800

  assets:
    - .env
    - assets/decor_png/
    - assets/icons_png/
    - assets/icons_svg/
    - assets/profile_images/
    - assets/heroes/
    - assets/guides/
    - assets/audio/
